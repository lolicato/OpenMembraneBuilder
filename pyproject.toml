[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenMembraneBuilder"
version = "2.0.0.dev1"
description = "GUI + CLI for building Martini coarse-grained membrane and membrane–protein systems with COBY"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas",
    "requests",
    "coby==1.0.14",
    "MDAnalysis>=2.7",
    "mdtraj",
    "vermouth",                # provides the martinize2 command
    "streamlit>=1.40",
    "streamlit-molstar>=0.4",
]

[project.optional-dependencies]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings-python"]

[project.scripts]
omb = "openmembranebuilder.cli:main"

[project.urls]
Documentation = "https://lolicato.github.io/OpenMembraneBuilder"
Source = "https://github.com/lolicato/OpenMembraneBuilder"

[tool.setuptools.packages.find]
include = ["openmembranebuilder*"]

[tool.setuptools.package-data]
# force fields, mdp files, scripts, membrane templates, example files
openmembranebuilder = ["resources/**/*"]
